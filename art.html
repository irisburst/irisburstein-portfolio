  <button class="lb-nav next" type="button" aria-label="Next video"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

<script>
// Galleries: hover previews video tiles (muted); click opens a full-screen viewer for videos and images
(() => {
  const tiles = [...document.querySelectorAll('.tile')];
  const lb = document.getElementById('lb'), lv = document.getElementById('lbVideo'), li = document.getElementById('lbImg');
  const stage = lb.querySelector('.lb-stage');
  const canHover = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const vidOf = t => t.querySelector('video');
  const rest = v => parseFloat(v.dataset.rest || '0');
  const seek = (v, t) => { try { v.currentTime = t; } catch (e) {} };
  let curTile = null, lastFocus = null, hideTimer = 0;

  tiles.forEach(t => { const v = vidOf(t); if (v) v.addEventListener('loadedmetadata', () => seek(v, rest(v))); });

  function show(t) {
    curTile = t;
    stage.style.setProperty('--ar', t.dataset.ar);
    const v = vidOf(t);
    if (v) {
      li.hidden = true; li.removeAttribute('src');
      lv.hidden = false;
      lv.poster = v.getAttribute('poster');
      lv.src = v.getAttribute('src');
      lv.muted = false;
      lv.loop = !!t.dataset.loop;
      lv.play().catch(() => {});
    } else {
      lv.pause(); lv.hidden = true; lv.removeAttribute('src'); lv.load();
      const im = t.querySelector('img');
      li.src = im.getAttribute('src'); li.alt = im.alt; li.hidden = false;
    }
  }
  function step(d) {
    const list = [...curTile.closest('.gallery').querySelectorAll('.tile')];
    show(list[(list.indexOf(curTile) + d + list.length) % list.length]);
  }
  function openLb(t) {
    clearTimeout(hideTimer);
    lastFocus = document.activeElement;
    tiles.forEach(x => { const v = vidOf(x); if (v) v.pause(); });
    lb.hidden = false;
    lockScroll();
    show(t);
    requestAnimationFrame(() => lb.classList.add('open'));
    lb.querySelector('.lb-close').focus({ preventScroll: true });
  }
  function closeLb() {
    lb.classList.remove('open');
    lv.pause();
    unlockScroll();
    hideTimer = setTimeout(() => { lb.hidden = true; lv.removeAttribute('src'); lv.load(); li.removeAttribute('src'); }, 250);
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
    document.querySelectorAll('video[data-auto]').forEach(v => {
      const r = v.getBoundingClientRect();
      if (r.bottom > 0 && r.top < innerHeight) v.play().catch(() => {});
    });
  }

  tiles.forEach(t => {
    const v = vidOf(t);
    if (v && t.closest('#motion')) {
      v.dataset.auto = '1';
      new IntersectionObserver(es => es.forEach(e => {
        if (e.isIntersecting && lb.hidden) v.play().catch(() => {}); else v.pause();
      }), { threshold: 0.25 }).observe(t);
    } else if (v && canHover) {
      t.addEventListener('mouseenter', () => { if (lb.hidden) { seek(v, 0); v.play().catch(() => {}); } });
      t.addEventListener('mouseleave', () => { v.pause(); seek(v, rest(v)); });
    }
    t.addEventListener('click', () => openLb(t));
    t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb(t); } });
  });

  lb.querySelector('.lb-close').addEventListener('click', closeLb);
  lb.querySelector('.prev').addEventListener('click', () => step(-1));
  lb.querySelector('.next').addEventListener('click', () => step(1));
  lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', e => {
    if (lb.hidden) return;
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'Tab') {
      const f = [...lb.querySelectorAll('button')];
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
})();
</script>
<script>
// Gallery items pop in (staggered) as they enter the viewport
(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) return;
  const tiles = [...document.querySelectorAll('.tile')];
  const io = new IntersectionObserver(entries => {
    let k = 0;
    entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top || a.boundingClientRect.left - b.boundingClientRect.left).forEach(e => {
      e.target.style.setProperty('--d', (k++ * 90) + 'ms');
      e.target.classList.add('in'); io.unobserve(e.target);
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
  tiles.forEach((t, i) => { t.style.setProperty('--rv-r', (i % 2 ? -2 : 2) + 'deg'); t.classList.add('rv'); io.observe(t); });
})();
</script>
<script>
// Pause any video that is playing with sound once it is scrolled out of view
(() => {
  const io = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target;
    if (!e.isIntersecting && !v.paused && !v.muted) v.pause();
  }), { threshold: 0.25 });
  document.querySelectorAll('video:not(#lbVideo)').forEach(v => io.observe(v));
})();
</script>
</body>
</html>
